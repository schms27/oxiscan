[package]
name = "oxiscan"
version = "0.3.0"
edition = "2021"
description = "Fast, self-contained network IP scanner written in Rust"
license = "MIT"
repository = "https://github.com/schms27/oxiscan"

[[bin]]
name = "oxiscan"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dns-lookup = "2"
egui-phosphor = "0.10.0"
rmcp = { version = "3.12", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "time"] }
schemars = "1.2.3"

[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[profile.release]
opt-level = 3
