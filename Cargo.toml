[package]
name = "oxiscan"
version = "0.1.0"
edition = "2021"
description = "Fast, Java-free network IP scanner written in Rust"
license = "MIT"
repository = "https://github.com/schms27/oxiscan"

[[bin]]
name = "oxiscan"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_extras = "0.32"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dns-lookup = "2"

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[profile.release]
opt-level = 3
